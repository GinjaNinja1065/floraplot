<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <!-- Inner Soft Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-opacity="0.25" />

  <!-- Central Botanical & Height Ruler Badge -->
  <g filter="url(#shadow)">
    <!-- Soil / Mound baseline -->
    <path d="M 110 395 C 190 370, 320 370, 402 395 C 410 415, 390 425, 256 425 C 122 425, 102 415, 110 395 Z" fill="#065f46" opacity="0.9" />

    <!-- Height Ruler on Left -->
    <rect x="136" y="110" width="22" height="280" rx="11" fill="url(#rulerGrad)" />
    <!-- Ruler Ticks -->
    <line x1="158" y1="140" x2="182" y2="140" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    <line x1="158" y1="180" x2="174" y2="180" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    <line x1="158" y1="220" x2="186" y2="220" stroke="#fef3c7" stroke-width="5" stroke-linecap="round" />
    <line x1="158" y1="260" x2="174" y2="260" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    <line x1="158" y1="300" x2="182" y2="300" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    <line x1="158" y1="340" x2="174" y2="340" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    
    <!-- Plant Stem -->
    <path d="M 276 395 Q 266 260 260 140" stroke="#10b981" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Bottom Left Leaf -->
    <path d="M 268 330 C 220 325 186 280 200 240 C 240 250 264 290 268 330 Z" fill="url(#leafGrad)" />
    
    <!-- Right Middle Leaf -->
    <path d="M 264 270 C 315 250 360 275 370 320 C 320 335 280 305 264 270 Z" fill="url(#leafGrad)" />

    <!-- Left Upper Leaf -->
    <path d="M 262 205 C 215 175 220 125 245 105 C 275 145 268 185 262 205 Z" fill="#6ee7b7" />

    <!-- Top Sprout Leaves -->
    <path d="M 260 140 C 285 105 325 110 335 135 C 310 160 280 155 260 140 Z" fill="#a7f3d0" />
    
    <!-- Height Indicator Arrow at Top -->
    <g transform="translate(147, 95)">
      <polygon points="0,-12 -8,2 8,2" fill="#fbbf24" />
    </g>

    <!-- Tally Counter Dots Badge -->
    <circle cx="340" cy="180" r="26" fill="#047857" stroke="#34d399" stroke-width="4" />
    <text x="340" y="188" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle">+1</text>
  </g>
</svg>
